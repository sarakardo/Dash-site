<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>پنل مدیریت دش</title><meta name="robots" content="noindex,nofollow,noarchive"><link rel="icon" href="/favicon.webp" type="image/png"><link rel="stylesheet" href="/style.css"></head><body class="admin-page"><main class="wrap admin-shell">
<section id="loginPanel" class="admin-card"><div class="eyebrow">دش · مدیریت</div><h1>ورود به پنل</h1><p>دسترسی به درخواست‌های مشتری، ثبت‌نام راننده و پیام‌های ارسالی.</p><label for="adminPassword">رمز مدیریت</label><input id="adminPassword" type="password" autocomplete="current-password"><button id="loginButton" class="btn primary admin-main-btn" type="button">ورود</button><div id="adminMessage" class="admin-message" aria-live="polite"></div></section>
<section id="dashboard" class="admin-card" hidden><div class="admin-head"><div><div class="eyebrow">داشبورد</div><h1>درخواست‌های دش</h1></div><div class="admin-actions"><button id="refreshButton" class="btn secondary" type="button">به‌روزرسانی</button><button id="logoutButton" class="btn secondary" type="button">خروج</button></div></div>
<div class="admin-filters"><label>جست‌وجو<input id="searchQuery" type="search" placeholder="نام، موبایل یا کد درخواست"></label><label>نوع<select id="filterType"><option value="">همه</option><option value="passenger_request">درخواست سفر</option><option value="driver_application">ثبت‌نام راننده</option><option value="contact">پیام</option></select></label><label>وضعیت<select id="filterStatus"><option value="">همه</option><option value="new">جدید</option><option value="contacted">تماس گرفته شد</option><option value="driver_found">راننده پیدا شد</option><option value="in_progress">در حال انجام</option><option value="completed">تکمیل شد</option><option value="cancelled">لغو شد</option></select></label></div>
<div class="table-wrap"><table><thead><tr><th>نوع و کد</th><th>شخص و تماس</th><th>کد ملی</th><th>جزئیات</th><th>وضعیت</th><th>مدارک</th></tr></thead><tbody id="adminTable"><tr><td colspan="6" class="empty">در حال بارگذاری…</td></tr></tbody></table></div></section></main><script src="/admin.js" defer></script></body></html>
