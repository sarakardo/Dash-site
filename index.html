<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پیام‌های دش</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/style.css"><style>body{background:#f4f7fa}.admin-intro{max-width:680px;color:#617081;line-height:1.9}.admin{padding:50px 0}.admin-card{background:#fff;border:1px solid #dde6ec;border-radius:25px;padding:25px;margin-bottom:16px}.admin-form{display:flex;gap:10px;flex-wrap:wrap}.admin-form input{font:inherit;border:1px solid #d8e3e9;border-radius:12px;padding:12px;min-width:260px}.msg{border-top:1px solid #e4ebef;padding:20px 0}.msg:first-child{border-top:0}.msg-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.msg small{color:#71808f}.msg-body{white-space:pre-wrap;margin-top:12px;line-height:2}.error{color:#b42318}.ok{color:#087443}</style></head><body><div class="nav-shell"><header class="wrap nav"><a class="brand" href="/">د<span>ش</span></a><a class="btn primary" href="/">بازگشت به سایت</a></header></div><main class="admin"><div class="wrap"><div class="admin-card"><h1>پیام‌های ارتباط با دش</h1><p class="admin-intro">این صفحه برای مشاهده پیام‌های دریافتی دش است. رمز مدیریت را فقط خودت نگه دار و آن را داخل فایل‌های سایت ننویس.</p><div class="admin-form"><input id="password" type="password" placeholder="رمز مدیریت"><button id="load" class="btn primary">مشاهده پیام‌ها</button></div><p id="status"></p></div><div id="messages" class="admin-card"></div></div></main><script>
const btn=document.getElementById('load'),pw=document.getElementById('password'),status=document.getElementById('status'),box=document.getElementById('messages');
btn.onclick=async()=>{status.textContent='در حال دریافت…';box.innerHTML='';try{const r=await fetch('/api/messages',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:pw.value})});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'خطا');status.className='ok';status.textContent=`${j.messages.length} پیام دریافت شده`;if(!j.messages.length){box.innerHTML='<p>هنوز پیامی ثبت نشده است.</p>';return;}box.innerHTML=j.messages.map(m=>`<article class="msg"><div class="msg-head"><strong>${esc(m.name)} — ${esc(m.phone)}</strong><small>${esc(m.created_at)}${m.subject?' · '+esc(m.subject):''}</small></div>${m.email?`<small>${esc(m.email)}</small>`:''}<div class="msg-body">${esc(m.message)}</div></article>`).join('');}catch(e){status.textContent=e.message;status.className='error';}};
function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script></body></html>
